<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELI20 Code Explorer — SDET Interview Prep</title>
<meta name="description" content="Interactive code explorer with click-to-explain tooltips for Java, JavaScript, Playwright, and DSA interview questions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0d1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #1c2128;
  --bg-code: #0d1117;
  --border-default: #30363d;
  --border-accent: #58a6ff;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-muted: #6e7681;
  --accent-blue: #58a6ff;
  --accent-purple: #bc8cff;
  --accent-green: #3fb950;
  --accent-orange: #d29922;
  --accent-red: #f85149;
  --accent-cyan: #79c0ff;
  --line-hover: rgba(88, 166, 255, 0.08);
  --line-active: rgba(88, 166, 255, 0.15);
  --popup-bg: #1c2128;
  --popup-border: #58a6ff;
  --popup-shadow: 0 16px 48px rgba(0,0,0,0.55), 0 0 0 1px rgba(88,166,255,0.2);
  --sidebar-width: 300px;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--font-sans);
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
  display: flex;
}

/* ─── SIDEBAR ─── */
.sidebar {
  width: var(--sidebar-width);
  min-width: var(--sidebar-width);
  background: var(--bg-secondary);
  border-right: 1px solid var(--border-default);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid var(--border-default);
  flex-shrink: 0;
}

.sidebar-header h1 {
  font-size: 16px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.3px;
}

.sidebar-header .subtitle {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

.sidebar-search {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-default);
  flex-shrink: 0;
}

.sidebar-search input {
  width: 100%;
  background: var(--bg-tertiary);
  border: 1px solid var(--border-default);
  border-radius: 6px;
  padding: 8px 12px;
  font-size: 13px;
  color: var(--text-primary);
  font-family: var(--font-sans);
  outline: none;
  transition: border-color 0.2s;
}

.sidebar-search input:focus {
  border-color: var(--accent-blue);
}

.sidebar-search input::placeholder {
  color: var(--text-muted);
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

.sidebar-nav::-webkit-scrollbar { width: 6px; }
.sidebar-nav::-webkit-scrollbar-track { background: transparent; }
.sidebar-nav::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }

.nav-group {
  margin-bottom: 4px;
}

.nav-group-title {
  padding: 8px 16px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  user-select: none;
}

.nav-group-title:hover { color: var(--text-secondary); }

.nav-group-title .arrow {
  font-size: 10px;
  transition: transform 0.2s;
}

.nav-group.collapsed .arrow { transform: rotate(-90deg); }
.nav-group.collapsed .nav-items { display: none; }

.nav-item {
  padding: 6px 16px 6px 28px;
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  border-left: 2px solid transparent;
}

.nav-item:hover {
  background: var(--line-hover);
  color: var(--text-primary);
}

.nav-item.active {
  background: var(--line-active);
  color: var(--accent-blue);
  border-left-color: var(--accent-blue);
}

.nav-count {
  display: inline-block;
  background: var(--bg-tertiary);
  border-radius: 10px;
  padding: 1px 6px;
  font-size: 10px;
  color: var(--text-muted);
  margin-left: 6px;
}

/* ─── MAIN CONTENT ─── */
.main {
  flex: 1;
  overflow-y: auto;
  padding: 32px 48px;
  scroll-behavior: smooth;
}

.main::-webkit-scrollbar { width: 8px; }
.main::-webkit-scrollbar-track { background: transparent; }
.main::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 4px; }

.file-section {
  margin-bottom: 48px;
}

.file-title {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.file-title .badge {
  font-size: 11px;
  font-weight: 500;
  background: linear-gradient(135deg, rgba(88,166,255,0.15), rgba(188,140,255,0.15));
  color: var(--accent-blue);
  padding: 3px 10px;
  border-radius: 12px;
  border: 1px solid rgba(88,166,255,0.2);
}

.file-desc {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 24px;
}

.code-block-wrapper {
  margin-bottom: 32px;
  border: 1px solid var(--border-default);
  border-radius: 8px;
  overflow: hidden;
  background: var(--bg-code);
  transition: border-color 0.2s;
}

.code-block-wrapper:hover {
  border-color: rgba(88,166,255,0.3);
}

.code-block-header {
  background: var(--bg-secondary);
  padding: 10px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-default);
}

.code-block-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 80%;
}

.code-block-lang {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-muted);
  background: var(--bg-tertiary);
  padding: 2px 8px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.code-block-body {
  overflow-x: auto;
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 1.6;
}

.code-block-body::-webkit-scrollbar { height: 6px; }
.code-block-body::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 3px; }

.code-line {
  display: flex;
  padding: 0 16px;
  min-height: 22px;
  transition: background 0.1s;
  cursor: default;
  position: relative;
}

.code-line.has-explanation {
  cursor: pointer;
}

.code-line.has-explanation:hover {
  background: var(--line-hover);
}

.code-line.has-explanation:hover .line-num {
  color: var(--accent-blue);
}

.code-line.active-line {
  background: var(--line-active);
}

.code-line.has-explanation::after {
  content: '💡';
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 11px;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}

.code-line.has-explanation:hover::after {
  opacity: 0.6;
}

.line-num {
  flex-shrink: 0;
  width: 40px;
  text-align: right;
  padding-right: 16px;
  color: var(--text-muted);
  user-select: none;
  font-size: 12px;
}

.line-content {
  flex: 1;
  white-space: pre;
  color: var(--text-primary);
}

/* Syntax colors */
.kw { color: #ff7b72; }
.str { color: #a5d6ff; }
.num { color: #79c0ff; }
.cm { color: #8b949e; font-style: italic; }
.fn { color: #d2a8ff; }
.tp { color: #79c0ff; }
.ann { color: #d29922; }
.op { color: #ff7b72; }

/* ─── POPUP TOOLTIP ─── */
.eli20-popup {
  position: fixed;
  z-index: 9999;
  background: var(--popup-bg);
  border: 1px solid var(--popup-border);
  border-radius: 10px;
  padding: 14px 18px;
  max-width: 520px;
  min-width: 280px;
  box-shadow: var(--popup-shadow);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
  backdrop-filter: blur(12px);
}

.eli20-popup.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.eli20-popup .popup-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--accent-blue);
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.eli20-popup .popup-label::before {
  content: '✦';
  font-size: 8px;
}

.eli20-popup .popup-code {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-muted);
  background: rgba(0,0,0,0.3);
  padding: 6px 10px;
  border-radius: 4px;
  margin-bottom: 10px;
  white-space: pre;
  overflow-x: auto;
  max-width: 100%;
}

.eli20-popup .popup-text {
  font-size: 13px;
  line-height: 1.55;
  color: var(--text-primary);
}

.eli20-popup .popup-dismiss {
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 8px;
  text-align: right;
}

/* ─── STATS BAR ─── */
.stats-bar {
  padding: 12px 20px;
  background: var(--bg-tertiary);
  border-top: 1px solid var(--border-default);
  font-size: 11px;
  color: var(--text-muted);
  display: flex;
  gap: 20px;
  flex-shrink: 0;
}

.stats-bar .stat-value {
  color: var(--accent-blue);
  font-weight: 600;
}

/* ─── INTRO HINT ─── */
.intro-hint {
  background: linear-gradient(135deg, rgba(88,166,255,0.08), rgba(188,140,255,0.08));
  border: 1px solid rgba(88,166,255,0.15);
  border-radius: 10px;
  padding: 16px 20px;
  margin-bottom: 32px;
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 13px;
  color: var(--text-secondary);
}

.intro-hint .hint-icon {
  font-size: 20px;
  flex-shrink: 0;
}

.intro-hint strong {
  color: var(--text-primary);
}

/* ─── RESPONSIVE ─── */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .main { padding: 16px; }
}
</style>
</head>

// ─── SIMPLE SYNTAX HIGHLIGHT ───
function highlight(code, lang) {
  const matches = [];

  function addMatch(start, end, type) {
    matches.push({ start, end, type });
  }

  function runRegex(regex, type, groupIndex = 0) {
    if (regex.global) regex.lastIndex = 0;
    let match;
    while ((match = regex.exec(code)) !== null) {
      let text = match[groupIndex];
      let start = match.index;
      if (groupIndex > 0) {
        start += match[0].indexOf(text);
      }
      addMatch(start, start + text.length, type);
    }
  }

  if (lang === 'java' || lang === 'unknown' || lang === '') {
    runRegex(/(\/\/.*$)/g, 'cm');
    runRegex(/(\/\*[\s\S]*?\*\/)/g, 'cm');
    runRegex(/("(?:[^"\\]|\\.)*")/g, 'str');
    runRegex(/('(?:[^'\\]|\\.)*')/g, 'str');
    runRegex(/(@\w+)/g, 'ann');
    runRegex(/\b(public|private|protected|static|final|abstract|class|interface|extends|implements|import|package|new|return|if|else|for|while|do|switch|case|default|break|continue|try|catch|finally|throw|throws|void|int|long|double|float|boolean|char|byte|short|null|true|false|this|super|instanceof)\b/g, 'kw');
    runRegex(/\b(\d+[lLfFdD]?)\b/g, 'num');
  }
  else if (lang === 'javascript' || lang === 'js' || lang === 'typescript' || lang === 'ts') {
    runRegex(/(\/\/.*$)/g, 'cm');
    runRegex(/(\/\*[\s\S]*?\*\/)/g, 'cm');
    runRegex(/('(?:[^'\\]|\\.)*'|"(?:[^"\\]|\\.)*"|`(?:[^`\\]|\\.)*`)/g, 'str');
    runRegex(/\b(const|let|var|function|async|await|return|if|else|for|while|new|try|catch|finally|throw|import|export|from|require|module|class|extends|true|false|null|undefined|typeof|instanceof)\b/g, 'kw');
    runRegex(/\b(\d+)\b/g, 'num');
  }
  else if (lang === 'gherkin') {
    runRegex(/(#.*$)/g, 'cm');
    if (code.match(/^\s*(Feature:|Scenario:|Scenario Outline:|Given|When|Then|And|But|Background:|Examples:)/)) {
      let regex = /^\s*(Feature:|Scenario:|Scenario Outline:|Given|When|Then|And|But|Background:|Examples:)/g;
      let match;
      while ((match = regex.exec(code)) !== null) {
        let kwText = match[1];
        let spacesLen = match[0].length - kwText.length;
        addMatch(match.index + spacesLen, match.index + match[0].length, 'kw');
      }
    }
    runRegex(/("(?:[^"\\]|\\.)*")/g, 'str');
    runRegex(/(<\w+>)/g, 'tp');
    runRegex(/(@\w+)/g, 'ann');
  }
  else if (lang === 'xml') {
    runRegex(/(<!--[\s\S]*?-->)/g, 'cm');
    let tagRegex = /(<\/?[a-zA-Z0-9:-]+)/g;
    let match;
    while ((match = tagRegex.exec(code)) !== null) {
      let isClosing = match[0].startsWith('</');
      let prefixLen = isClosing ? 2 : 1;
      addMatch(match.index + prefixLen, match.index + match[0].length, 'kw');
    }
    runRegex(/("(?:[^"\\]|\\.)*")/g, 'str');
  }
  else if (lang === 'json') {
    let keyRegex = /("(?:[^"\\]|\\.)*")\s*:/g;
    let keyMatch;
    while ((keyMatch = keyRegex.exec(code)) !== null) {
      addMatch(keyMatch.index, keyMatch.index + keyMatch[1].length, 'tp');
    }
    let valRegex = /:(\s*)("(?:[^"\\]|\\.)*")/g;
    let valMatch;
    while ((valMatch = valRegex.exec(code)) !== null) {
      let valStart = valMatch.index + valMatch[0].indexOf(valMatch[2]);
      addMatch(valStart, valStart + valMatch[2].length, 'str');
    }
    runRegex(/\b(true|false|null)\b/g, 'kw');
    runRegex(/\b(\d+\.?\d*)\b/g, 'num');
  }
  else if (lang === 'yaml' || lang === 'yml') {
    runRegex(/(#.*$)/g, 'cm');
    let keyRegex = /^([\w_-]+):/gm;
    let keyMatch;
    while ((keyMatch = keyRegex.exec(code)) !== null) {
      addMatch(keyMatch.index, keyMatch.index + keyMatch[1].length, 'tp');
    }
    runRegex(/("(?:[^"\\]|\\.)*")/g, 'str');
  }
  else if (lang === 'properties') {
    runRegex(/(#.*$)/g, 'cm');
    let keyRegex = /^([\w._-]+)\s*=/gm;
    let keyMatch;
    while ((keyMatch = keyRegex.exec(code)) !== null) {
      addMatch(keyMatch.index, keyMatch.index + keyMatch[1].length, 'tp');
    }
  }

  matches.sort((a, b) => {
    if (a.start !== b.start) return a.start - b.start;
    return b.end - a.end;
  });

  const activeMatches = [];
  let lastEnd = 0;
  for (const m of matches) {
    if (m.start >= lastEnd) {
      activeMatches.push(m);
      lastEnd = m.end;
    }
  }

  let result = '';
  let i = 0;
  let matchIdx = 0;

  function escapeHTML(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  while (i < code.length) {
    if (matchIdx < activeMatches.length && i === activeMatches[matchIdx].start) {
      const m = activeMatches[matchIdx];
      const tokenText = code.substring(m.start, m.end);
      result += '<span class="' + m.type + '">' + escapeHTML(tokenText) + '</span>';
      i = m.end;
      matchIdx++;
    } else {
      result += escapeHTML(code[i]);
      i++;
    }
  }

  return result;
}

// ─── RENDER ───
const mainEl = document.getElementById('mainContent');
const navEl = document.getElementById('sidebarNav');
const popup = document.getElementById('popup');
const popupCode = document.getElementById('popupCode');
const popupText = document.getElementById('popupText');

let totalBlocks = 0;
let totalExplained = 0;
let activePopupLine = null;

// Build intro hint
const hint = document.createElement('div');
hint.className = 'intro-hint';
hint.innerHTML = `
  <span class="hint-icon">💡</span>
  <span><strong>Click any code line with a 💡 icon</strong> to see an ELI20 explanation popup. Lines without explanations are structural (braces, blank lines). Press <strong>Esc</strong> or click outside to dismiss.</span>
`;
mainEl.appendChild(hint);

DATA.forEach((file, fi) => {
  // File section
  const section = document.createElement('div');
  section.className = 'file-section';
  section.id = `file-${fi}`;

  const titleEl = document.createElement('div');
  titleEl.className = 'file-title';
  titleEl.innerHTML = `${file.label} <span class="badge">${file.blocks.length} blocks</span>`;
  section.appendChild(titleEl);

  // Nav group
  const navGroup = document.createElement('div');
  navGroup.className = 'nav-group';
  const navTitle = document.createElement('div');
  navTitle.className = 'nav-group-title';
  navTitle.innerHTML = `<span class="arrow">▼</span> ${file.label} <span class="nav-count">${file.blocks.length}</span>`;
  navTitle.addEventListener('click', () => {
    navGroup.classList.toggle('collapsed');
  });
  navGroup.appendChild(navTitle);

  const navItems = document.createElement('div');
  navItems.className = 'nav-items';

  file.blocks.forEach((block, bi) => {
    totalBlocks++;
    const blockId = `block-${fi}-${bi}`;
    const wrapper = document.createElement('div');
    wrapper.className = 'code-block-wrapper';
    wrapper.id = blockId;

    const header = document.createElement('div');
    header.className = 'code-block-header';
    const title = block.question || block.section || 'Code Block';
    header.innerHTML = `
      <div class="code-block-title">${title.replace(/</g,'&lt;')}</div>
      <div class="code-block-lang">${block.lang}</div>
    `;
    wrapper.appendChild(header);

    const body = document.createElement('div');
    body.className = 'code-block-body';

    block.lines.forEach((ln, li) => {
      const lineEl = document.createElement('div');
      lineEl.className = 'code-line';
      if (ln.explanation) {
        lineEl.classList.add('has-explanation');
        totalExplained++;
      }

      const numEl = document.createElement('span');
      numEl.className = 'line-num';
      numEl.textContent = li + 1;

      const contentEl = document.createElement('span');
      contentEl.className = 'line-content';
      contentEl.innerHTML = highlight(ln.code, block.lang);

      lineEl.appendChild(numEl);
      lineEl.appendChild(contentEl);

      if (ln.explanation) {
        lineEl.addEventListener('click', (e) => {
          e.stopPropagation();
          showPopup(lineEl, ln.code.trim(), ln.explanation);
        });
      }

      body.appendChild(lineEl);
    });

    wrapper.appendChild(body);
    section.appendChild(wrapper);

    // Nav item
    const navItem = document.createElement('div');
    navItem.className = 'nav-item';
    navItem.textContent = title.length > 40 ? title.substring(0, 37) + '...' : title;
    navItem.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      navItem.classList.add('active');
      document.getElementById(blockId).scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    navItems.appendChild(navItem);
  });

  navGroup.appendChild(navItems);
  navEl.appendChild(navGroup);
  mainEl.appendChild(section);
});

// Stats
document.getElementById('statsBar').innerHTML = `
  <span>Files: <span class="stat-value">${DATA.length}</span></span>
  <span>Blocks: <span class="stat-value">${totalBlocks}</span></span>
  <span>Explained: <span class="stat-value">${totalExplained}</span></span>
`;

// ─── POPUP LOGIC ───
function showPopup(lineEl, code, text) {
  if (activePopupLine === lineEl) {
    hidePopup();
    return;
  }

  if (activePopupLine) activePopupLine.classList.remove('active-line');
  activePopupLine = lineEl;
  lineEl.classList.add('active-line');

  popupCode.textContent = code;
  popupText.textContent = text;

  popup.classList.add('visible');

  const rect = lineEl.getBoundingClientRect();
  const ph = popup.offsetHeight;
  const pw = popup.offsetWidth;

  let top = rect.bottom + 8;
  let left = rect.left + 40;

  if (top + ph > window.innerHeight) top = rect.top - ph - 8;
  if (left + pw > window.innerWidth) left = window.innerWidth - pw - 16;
  if (left < 8) left = 8;

  popup.style.top = top + 'px';
  popup.style.left = left + 'px';
}

function hidePopup() {
  popup.classList.remove('visible');
  if (activePopupLine) {
    activePopupLine.classList.remove('active-line');
    activePopupLine = null;
  }
}

document.addEventListener('click', (e) => {
  if (!popup.contains(e.target) && !e.target.closest('.code-line.has-explanation')) {
    hidePopup();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') hidePopup();
});

// ─── SEARCH ───
document.getElementById('searchInput').addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase().trim();
  document.querySelectorAll('.nav-item').forEach(item => {
    item.style.display = item.textContent.toLowerCase().includes(query) || !query ? '' : 'none';
  });
  document.querySelectorAll('.code-block-wrapper').forEach(block => {
    const title = block.querySelector('.code-block-title');
    if (!query || title.textContent.toLowerCase().includes(query)) {
      block.style.display = '';
    } else {
      block.style.display = 'none';
    }
  });
});
</script>
</body>
